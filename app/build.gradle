plugins { id 'com.android.application' }
android {
 namespace 'cc.wckd.walkietalkie'
 compileSdk 36
 buildToolsVersion '36.0.0'
 ndkVersion '28.2.13676358'
 defaultConfig {
  applicationId 'cc.wckd.walkietalkie'
  minSdk 31
  testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
  targetSdk 36
  versionCode 2
  versionName '0.2.0-expressive'
  ndk { abiFilters 'arm64-v8a' }
  externalNativeBuild { cmake { cppFlags '-std=c++17'; arguments '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON' } }
 }
 signingConfigs { demo { storeFile file('../demo.keystore'); storePassword 'android'; keyAlias 'murmur'; keyPassword 'android' } }
 buildTypes { debug { signingConfig signingConfigs.demo }; release { signingConfig signingConfigs.demo; minifyEnabled false } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.31.6' } }
 packaging { jniLibs { useLegacyPackaging = true; keepDebugSymbols += ['**/libggml-htp-*.so']; pickFirsts += ['**/libc++_shared.so'] } }
 lint { abortOnError true; disable 'ObsoleteSdkInt' }
}
dependencies {
 implementation 'com.google.android.material:material:1.14.0'
 androidTestImplementation 'androidx.test:runner:1.7.0'
 androidTestImplementation 'androidx.test.ext:junit:1.3.0'
 androidTestImplementation 'androidx.test:core:1.7.0'
 implementation 'ai.moonshine:moonshine-voice:0.1.5'
 implementation 'com.squareup.okhttp3:okhttp:4.12.0'
 testImplementation 'junit:junit:4.13.2'
}
