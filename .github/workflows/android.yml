name: Build WalkieTalkie demo
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    timeout-minutes: 90
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.31.6"
      - name: Build compatible speech runtime
        run: |
          python -m pip install cmake==3.31.6 ninja packaging numpy sympy flatbuffers
          python -m unittest discover -s scripts/tests -v
          python scripts/build-safe-speech.py --jobs 2
      - name: Fetch pinned Snapdragon runtime
        run: python scripts/bootstrap.py
      - name: Build and check
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease assembleDebugAndroidTest testDebugUnitTest lintDebug
          python scripts/verify-safe-speech.py app/build/outputs/apk/debug/app-debug.apk
          python scripts/verify-safe-speech.py app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: walkietalkie-unsigned-release-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Build native emulator test APK
        run: ./gradlew --no-daemon -PtestAbi=x86_64 assembleDebug assembleDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run app in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          ram-size: 4096M
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash scripts/emulator-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: walkietalkie-emulator-results
          path: |
            emulator-results/
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html

  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release/0.2.3-safe-speech')
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: walkietalkie-unsigned-release-apk
          path: release-assets
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: build-tools;36.0.0
      - name: Sign release with stable project key
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: python scripts/sign-release.py release-assets/app-release-unsigned.apk release-assets/app-release.apk
      - name: Record public signing certificate
        run: '"$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs release-assets/app-release.apk > release-assets/SIGNING_CERTIFICATE.txt'
      - name: Publish tested release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle)
          TAG="v$VERSION"
          APK="release-assets/WalkieTalkie-$VERSION.apk"
          mv release-assets/app-release.apk "$APK"
          (cd release-assets && sha256sum "WalkieTalkie-$VERSION.apk" > SHA256SUMS.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; bump versionName before publishing another release."
            exit 0
          fi
          gh release create "$TAG" "$APK" release-assets/SHA256SUMS.txt release-assets/SIGNING_CERTIFICATE.txt --target "$GITHUB_SHA" --prerelease --title "WalkieTalkie $VERSION" --notes-file release-notes.md
